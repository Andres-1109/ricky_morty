<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <link rel="stylesheet" href="header.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-green-500 shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <!-- LOGO -->
            <div class="flex items-center gap-4">
                <img
                    src="https://rickandmortyapi.com/icons/icon-512x512.png"
                    alt="Rick and Morty"
                    class="w-14 h-14 rounded-full border-2 border-green-400"
                >

                <h1 class="text-3xl font-bold text-green-400">
                    Rick & Morty
                </h1>
            </div>

            <!-- NAV -->
            <nav>
                <ul class="flex items-center gap-8 text-white font-semibold">
                    <li>
                        <a
                            href="#"
                            class="hover:text-green-400 transition duration-300"
                        >
                            Character
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            class="hover:text-green-400 transition duration-300"
                        >
                            Location
                        </a>
                    </li>

                    <li>
                        <a
                            href="#"
                            class="hover:text-green-400 transition duration-300"
                        >
                            Episode
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- SEARCH Y LOGOUT -->
            <div class="flex items-center gap-3">

                <input
                    type="text"
                    placeholder="Search character..."
                    class="w-64 px-4 py-2 rounded-lg bg-slate-800 text-white border border-slate-700 focus:outline-none focus:border-green-400"
                >

                <button
                    class="bg-red-500 hover:bg-red-600 px-5 py-2 rounded-lg text-white font-semibold transition duration-300"
                >
                    Logout
                </button>

            </div>

        </div>
    </header>

    <!-- HERO -->
    <section class="max-w-7xl mx-auto px-6 py-16">

        <div class="text-center">

            <h2 class="text-6xl font-extrabold text-green-400 mb-6">
                Rick and Morty Universe
            </h2>

            <p class="text-gray-300 text-xl max-w-3xl mx-auto">
                Explore all characters, locations and episodes from the
                multiverse of Rick and Morty.
            </p>

            <button
                class="mt-8 bg-green-500 hover:bg-green-600 text-black font-bold px-8 py-3 rounded-lg transition duration-300"
            >
                Explore Now
            </button>

        </div>

    </section>

</body>
</html>
