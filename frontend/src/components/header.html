<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rick And Morty Header</title>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-zinc-950">

  <!-- HEADER -->
  <header class="w-full bg-zinc-900 border-b-2 border-green-500 px-10 py-5 shadow-lg shadow-green-500/20">

    <div class="flex items-center justify-between gap-6">

      <!-- LOGO -->
      <div>
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Rick_and_Morty.svg"
          alt="Rick And Morty Logo"
          class="w-40"
        >
      </div>

      <!-- SEARCH -->
      <div class="flex-1 relative">

        <input
          type="text"
          placeholder="Search characters..."
          class="w-full bg-zinc-800 border border-green-500 text-white px-6 py-3 rounded-full outline-none focus:ring-2 focus:ring-green-400"
        >

        <button
          class="absolute right-2 top-1/2 -translate-y-1/2 bg-green-500 hover:bg-green-400 text-black font-bold px-5 py-2 rounded-full"
        >
          Search
        </button>

      </div>

      <!-- LOGOUT -->
      <button
        class="bg-red-500 hover:bg-red-400 text-white font-bold px-6 py-3 rounded-full"
      >
        Logout
      </button>

    </div>

  </header>

</body>
</html>
